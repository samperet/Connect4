<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7efd9">
  <title>Connect 4</title>
  <style>
    :root {
      --cream: #f7efd9;
      --cream-deep: #ead9af;
      --ink: #24324a;
      --muted: #6c7280;
      --maroon: #c9485b;
      --maroon-dark: #8f263a;
      --teal: #76c9bd;
      --teal-dark: #358f88;
      --board: #3768d9;
      --board-dark: #173d9b;
      --board-light: #5687ef;
      --white: #fffdf6;
      --board-width: min(91vw, 660px, 94vh);
      --gap: clamp(5px, 1.1vw, 11px);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Trebuchet MS", system-ui, sans-serif;
      text-align: center;
      background:
        radial-gradient(circle at 12% 12%, rgba(255,255,255,.85) 0 8%, transparent 28%),
        radial-gradient(circle at 88% 84%, rgba(233,188,96,.22) 0 7%, transparent 27%),
        linear-gradient(145deg, var(--cream), #fbf7e9 55%, var(--cream-deep));
      overflow-x: hidden;
    }

    button { font: inherit; }

    .screen {
      min-height: 100svh;
      padding: max(18px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
    }

    #start-screen {
      display: grid;
      place-items: center;
    }

    .start-card {
      width: min(92vw, 620px);
      padding: clamp(34px, 7vw, 64px);
      border: 1px solid rgba(70, 55, 32, .1);
      border-radius: 36px;
      background: rgba(255, 253, 246, .72);
      box-shadow: 0 26px 70px rgba(91, 70, 30, .16), inset 0 1px rgba(255,255,255,.9);
      backdrop-filter: blur(10px);
    }

    .logo-pieces {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .logo-piece, .turn-dot {
      border-radius: 50%;
      box-shadow: inset 0 5px 7px rgba(255,255,255,.42), inset 0 -6px 8px rgba(0,0,0,.19), 0 5px 0 rgba(44,49,63,.12);
    }

    .logo-piece { width: clamp(44px, 10vw, 72px); aspect-ratio: 1; }
    .logo-piece:first-child { background: radial-gradient(circle at 34% 27%, #f27a88, var(--maroon) 50%, var(--maroon-dark)); }
    .logo-piece:last-child { background: radial-gradient(circle at 34% 27%, #b4eee5, var(--teal) 50%, var(--teal-dark)); }

    h1 {
      margin: 0;
      font-size: clamp(56px, 13vw, 104px);
      font-weight: 1000;
      line-height: .9;
      letter-spacing: -.08em;
      text-shadow: 0 5px 0 rgba(36,50,74,.09);
    }

    .tagline {
      margin: 24px auto 30px;
      color: var(--muted);
      font-size: clamp(17px, 3.6vw, 22px);
    }

    .primary-button, .utility-button {
      border: 0;
      cursor: pointer;
      font-weight: 900;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }

    .primary-button {
      min-width: 210px;
      padding: 17px 28px;
      color: white;
      font-size: 20px;
      border-radius: 18px;
      background: linear-gradient(145deg, #4c7bea, #2855c4);
      box-shadow: 0 8px 0 #183b94, 0 15px 28px rgba(39,84,191,.25);
    }

    .primary-button:hover, .utility-button:hover { transform: translateY(-2px); filter: brightness(1.04); }
    .primary-button:active, .utility-button:active { transform: translateY(2px); }
    .primary-button:focus-visible, .utility-button:focus-visible, .cell:focus-visible { outline: 4px solid #f4ad3f; outline-offset: 4px; }

    #game-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2vh, 18px);
    }

    .game-topbar {
      width: var(--board-width);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }

    .mini-title {
      margin: 0;
      font-size: clamp(24px, 5vw, 38px);
      font-weight: 1000;
      letter-spacing: -.06em;
    }

    .score {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid rgba(54,57,72,.08);
      border-radius: 15px;
      background: rgba(255,253,246,.72);
      box-shadow: 0 5px 14px rgba(79,66,39,.1);
      font-weight: 900;
    }

    .score.maroon-score { justify-self: start; color: var(--maroon-dark); }
    .score.teal-score { justify-self: end; color: var(--teal-dark); }

    .score-chip { width: 20px; aspect-ratio: 1; border-radius: 50%; box-shadow: inset 0 2px 3px rgba(255,255,255,.5), inset 0 -3px 3px rgba(0,0,0,.16); }
    .maroon-score .score-chip { background: var(--maroon); }
    .teal-score .score-chip { background: var(--teal); }

    .status-pill {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 20px;
      border-radius: 999px;
      background: rgba(255,253,246,.82);
      box-shadow: 0 7px 20px rgba(70,60,40,.1), inset 0 1px rgba(255,255,255,.9);
      font-size: clamp(16px, 3vw, 20px);
      font-weight: 900;
    }

    .turn-dot { width: 25px; aspect-ratio: 1; background: var(--maroon); }
    .status-pill.teal .turn-dot { background: var(--teal); }

    .board-wrap {
      position: relative;
      width: var(--board-width);
      padding-top: clamp(24px, 5vw, 42px);
      perspective: 900px;
    }

    .preview-piece {
      position: absolute;
      z-index: 0;
      top: 0;
      left: var(--preview-left, 7.14%);
      width: calc((100% - (8 * var(--gap))) / 7 * .72);
      aspect-ratio: 1;
      border-radius: 50%;
      opacity: 0;
      transform: translateX(-50%) translateY(4px);
      transition: left .13s ease, opacity .13s ease, transform .13s ease;
      pointer-events: none;
    }

    .board-wrap.previewing .preview-piece { opacity: .52; transform: translateX(-50%) translateY(0); }

    .game-board {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: var(--gap);
      width: 100%;
      padding: var(--gap);
      border: clamp(5px, 1vw, 9px) solid var(--board-dark);
      border-radius: clamp(18px, 3vw, 28px);
      background: linear-gradient(145deg, var(--board-light), var(--board) 46%, #2857c2);
      box-shadow:
        0 10px 0 #102d77,
        0 20px 30px rgba(28,46,90,.25),
        inset 0 3px 1px rgba(255,255,255,.3),
        inset 0 -5px 8px rgba(11,37,105,.28);
      transform: rotateX(1.8deg);
      transform-origin: center bottom;
    }

    .cell {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background:
        radial-gradient(circle at 50% 42%, rgba(255,255,255,.05) 0 48%, transparent 49%),
        radial-gradient(circle at 44% 38%, #ded8c5, var(--cream) 59%, #fffaf0 61%);
      box-shadow:
        inset 0 7px 10px rgba(8,31,90,.65),
        inset 0 -2px 2px rgba(255,255,255,.45),
        0 2px 0 rgba(255,255,255,.18);
      overflow: visible;
      -webkit-tap-highlight-color: transparent;
    }

    .cell:hover { filter: brightness(1.03); }
    .cell[disabled] { cursor: default; }

    .piece, .preview-piece {
      background: radial-gradient(circle at 32% 25%, #f27d8b 0 9%, var(--maroon) 44%, var(--maroon-dark) 100%);
      box-shadow:
        inset 0 6px 7px rgba(255,255,255,.3),
        inset 0 -8px 9px rgba(82,9,26,.3),
        0 3px 2px rgba(21,34,63,.25);
    }

    .piece.teal, .preview-piece.teal {
      background: radial-gradient(circle at 32% 25%, #c2f3eb 0 9%, var(--teal) 44%, var(--teal-dark) 100%);
      box-shadow:
        inset 0 6px 7px rgba(255,255,255,.4),
        inset 0 -8px 9px rgba(18,95,89,.28),
        0 3px 2px rgba(21,34,63,.25);
    }

    .piece {
      width: 82%;
      aspect-ratio: 1;
      border-radius: 50%;
      will-change: transform;
    }

    .piece.dropping {
      animation: piece-drop 560ms cubic-bezier(.2,.72,.3,1) both;
    }

    @keyframes piece-drop {
      0% { transform: translateY(calc(-1 * var(--drop-distance))) scale(.94); }
      68% { transform: translateY(0) scale(1); }
      80% { transform: translateY(-13%) scale(1.03, .97); }
      89% { transform: translateY(0) scale(.99, 1.01); }
      95% { transform: translateY(-4%); }
      100% { transform: translateY(0); }
    }

    .piece.winner-piece { animation: winner-pop 760ms ease-in-out infinite alternate; }

    @keyframes winner-pop {
      from { transform: scale(.92); filter: brightness(1); }
      to { transform: scale(1.08); filter: brightness(1.17); box-shadow: inset 0 6px 7px rgba(255,255,255,.4), inset 0 -8px 9px rgba(0,0,0,.18), 0 0 0 5px rgba(255,255,255,.75), 0 8px 16px rgba(18,33,73,.32); }
    }

    .controls { display: flex; gap: 10px; }

    .utility-button {
      padding: 10px 17px;
      color: var(--ink);
      border: 1px solid rgba(55,58,68,.1);
      border-radius: 13px;
      background: rgba(255,253,246,.82);
      box-shadow: 0 4px 0 rgba(87,72,43,.18);
    }

    .winner-mascot {
      position: fixed;
      z-index: 5;
      right: clamp(12px, 4vw, 48px);
      bottom: clamp(12px, 4vw, 38px);
      width: clamp(76px, 15vw, 130px);
      display: none;
      filter: drop-shadow(0 10px 10px rgba(45,38,24,.2));
      animation: banana-bounce .8s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes banana-bounce {
      from { transform: translateY(8px) rotate(-7deg); }
      to { transform: translateY(-10px) rotate(7deg); }
    }

    .shake { animation: column-shake .28s ease; }
    @keyframes column-shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-2px); } }

    @media (max-width: 520px) {
      :root { --board-width: min(94vw, 660px, 94vh); --gap: 5px; }
      .screen { padding-left: 10px; padding-right: 10px; }
      .game-topbar { gap: 6px; }
      .score { padding: 7px 9px; font-size: 14px; }
      .score-chip { width: 16px; }
      .mini-title { font-size: 23px; }
      .game-board { border-width: 5px; }
      .status-pill { min-height: 42px; padding: 8px 15px; }
    }

    @media (max-height: 650px) and (orientation: landscape) {
      :root { --board-width: min(62vw, 560px, 105vh); }
      #game-screen { gap: 7px; justify-content: flex-start; }
      .board-wrap { padding-top: 18px; }
      .game-topbar { position: absolute; left: 16px; top: 16px; width: calc(100vw - 32px); }
      .status-pill { position: absolute; right: 18px; top: 70px; }
      .controls { position: absolute; right: 18px; bottom: 20px; flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main>
    <section id="start-screen" class="screen">
      <div class="start-card">
        <div class="logo-pieces" aria-hidden="true"><span class="logo-piece"></span><span class="logo-piece"></span></div>
        <h1>Connect 4</h1>
        <p class="tagline">Line up four pieces before your opponent does.</p>
        <button class="primary-button" id="start-button" type="button">Let’s play</button>
      </div>
    </section>

    <section id="game-screen" class="screen" aria-label="Connect 4 game">
      <header class="game-topbar">
        <div class="score maroon-score"><span class="score-chip" aria-hidden="true"></span><span>Maroon</span><strong id="maroon-score">0</strong></div>
        <h2 class="mini-title">Connect 4</h2>
        <div class="score teal-score"><strong id="teal-score">0</strong><span>Teal</span><span class="score-chip" aria-hidden="true"></span></div>
      </header>

      <div class="status-pill" id="turn-info" role="status" aria-live="polite"><span class="turn-dot" aria-hidden="true"></span><span id="status-text">Maroon’s turn</span></div>

      <div class="board-wrap" id="board-wrap">
        <div class="preview-piece" id="preview-piece" aria-hidden="true"></div>
        <div class="game-board" id="game-board" role="grid" aria-label="Connect 4 board"></div>
      </div>

      <div class="controls">
        <button class="utility-button" id="new-round-button" type="button">New round</button>
        <button class="utility-button" id="reset-score-button" type="button">Reset score</button>
      </div>
      <img src="banana.gif" alt="" class="winner-mascot" id="winner-mascot">
    </section>
  </main>

  <audio id="maroon-sound" src="1.mp3" preload="auto"></audio>
  <audio id="teal-sound" src="2.mp3" preload="auto"></audio>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    const ROWS = 6;
    const COLS = 7;
    const DROP_DURATION = 560;
    let board = createEmptyBoard();
    let currentPlayer = 'maroon';
    let nextStarter = 'maroon';
    let gameOver = false;
    let isAnimating = false;
    let moves = 0;
    const scores = { maroon: 0, teal: 0 };

    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const gameBoard = document.getElementById('game-board');
    const boardWrap = document.getElementById('board-wrap');
    const previewPiece = document.getElementById('preview-piece');
    const turnInfo = document.getElementById('turn-info');
    const statusText = document.getElementById('status-text');
    const winnerMascot = document.getElementById('winner-mascot');

    function createEmptyBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    }

    function startGame() {
      startScreen.style.display = 'none';
      gameScreen.style.display = 'flex';
      buildBoard();
      updateStatus();
    }

    function buildBoard() {
      gameBoard.innerHTML = '';
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const cell = document.createElement('button');
          cell.type = 'button';
          cell.className = 'cell';
          cell.dataset.row = row;
          cell.dataset.col = col;
          cell.setAttribute('role', 'gridcell');
          cell.setAttribute('aria-label', `Column ${col + 1}, row ${row + 1}`);
          cell.addEventListener('click', () => dropPiece(col));
          cell.addEventListener('pointerenter', () => showPreview(col));
          if (board[row][col]) cell.appendChild(makePiece(board[row][col]));
          gameBoard.appendChild(cell);
        }
      }
    }

    function makePiece(player, dropping = false) {
      const piece = document.createElement('span');
      piece.className = `piece ${player}${dropping ? ' dropping' : ''}`;
      piece.setAttribute('aria-hidden', 'true');
      return piece;
    }

    function dropPiece(col) {
      if (gameOver || isAnimating) return;
      let row = -1;
      for (let candidate = ROWS - 1; candidate >= 0; candidate--) {
        if (!board[candidate][col]) { row = candidate; break; }
      }

      if (row < 0) {
        gameBoard.classList.remove('shake');
        void gameBoard.offsetWidth;
        gameBoard.classList.add('shake');
        statusText.textContent = 'That column is full — try another!';
        return;
      }

      isAnimating = true;
      board[row][col] = currentPlayer;
      moves++;
      const cell = getCell(row, col);
      const piece = makePiece(currentPlayer, true);
      piece.style.setProperty('--drop-distance', `${cell.offsetTop + cell.offsetHeight * .88}px`);
      cell.appendChild(piece);
      playSound(currentPlayer);

      window.setTimeout(() => finishTurn(row, col, piece), DROP_DURATION);
    }

    function finishTurn(row, col, piece) {
      piece.classList.remove('dropping');
      const winningCells = findWinningCells(row, col);
      if (winningCells.length >= 4) {
        finishGame(winningCells);
      } else if (moves === ROWS * COLS) {
        gameOver = true;
        statusText.textContent = 'It’s a draw! Great game.';
        turnInfo.className = 'status-pill';
        nextStarter = currentPlayer === 'maroon' ? 'teal' : 'maroon';
        disableBoard();
      } else {
        currentPlayer = currentPlayer === 'maroon' ? 'teal' : 'maroon';
        updateStatus();
      }
      isAnimating = false;
    }

    function findWinningCells(row, col) {
      const player = board[row][col];
      const directions = [[0,1], [1,0], [1,1], [1,-1]];
      for (const [dr, dc] of directions) {
        const line = [[row, col]];
        for (const sign of [-1, 1]) {
          for (let step = 1; step < 4; step++) {
            const r = row + dr * step * sign;
            const c = col + dc * step * sign;
            if (r < 0 || r >= ROWS || c < 0 || c >= COLS || board[r][c] !== player) break;
            line.push([r, c]);
          }
        }
        if (line.length >= 4) return line;
      }
      return [];
    }

    function finishGame(winningCells) {
      gameOver = true;
      scores[currentPlayer]++;
      document.getElementById(`${currentPlayer}-score`).textContent = scores[currentPlayer];
      statusText.textContent = `${capitalize(currentPlayer)} wins!`;
      turnInfo.className = `status-pill ${currentPlayer === 'teal' ? 'teal' : ''}`;
      winningCells.forEach(([row, col]) => getCell(row, col).firstElementChild?.classList.add('winner-piece'));
      nextStarter = currentPlayer === 'maroon' ? 'teal' : 'maroon';
      winnerMascot.style.display = 'block';
      disableBoard();
      celebrate(currentPlayer);
    }

    function newRound() {
      board = createEmptyBoard();
      currentPlayer = nextStarter;
      gameOver = false;
      isAnimating = false;
      moves = 0;
      winnerMascot.style.display = 'none';
      boardWrap.classList.remove('previewing');
      buildBoard();
      updateStatus();
    }

    function resetScore() {
      scores.maroon = 0;
      scores.teal = 0;
      document.getElementById('maroon-score').textContent = '0';
      document.getElementById('teal-score').textContent = '0';
      nextStarter = 'maroon';
      newRound();
    }

    function updateStatus() {
      statusText.textContent = `${capitalize(currentPlayer)}’s turn`;
      turnInfo.className = `status-pill ${currentPlayer === 'teal' ? 'teal' : ''}`;
      previewPiece.className = `preview-piece ${currentPlayer}`;
    }

    function showPreview(col) {
      if (gameOver || isAnimating) return;
      boardWrap.style.setProperty('--preview-left', `${((col + .5) / COLS) * 100}%`);
      boardWrap.classList.add('previewing');
    }

    function disableBoard() {
      gameBoard.querySelectorAll('.cell').forEach(cell => { cell.disabled = true; });
      boardWrap.classList.remove('previewing');
    }

    function getCell(row, col) {
      return gameBoard.querySelector(`[data-row="${row}"][data-col="${col}"]`);
    }

    function playSound(player) {
      const sound = document.getElementById(`${player}-sound`);
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }

    function celebrate(player) {
      if (!window.confetti) return;
      const colors = player === 'maroon' ? ['#c9485b', '#f27a88', '#fffdf6'] : ['#76c9bd', '#b4eee5', '#fffdf6'];
      window.confetti({ particleCount: 90, spread: 75, startVelocity: 38, origin: { y: .62 }, colors });
      window.setTimeout(() => window.confetti({ particleCount: 45, spread: 105, origin: { y: .58 }, colors }), 220);
    }

    function capitalize(value) { return value[0].toUpperCase() + value.slice(1); }

    document.getElementById('start-button').addEventListener('click', startGame);
    document.getElementById('new-round-button').addEventListener('click', newRound);
    document.getElementById('reset-score-button').addEventListener('click', resetScore);
    boardWrap.addEventListener('pointerleave', () => boardWrap.classList.remove('previewing'));
    document.addEventListener('keydown', event => {
      if (event.key.toLowerCase() === 'r' && gameScreen.style.display === 'flex') newRound();
    });
  </script>
</body>
</html>
